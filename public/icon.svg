<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#101935" />
      <stop offset="100%" stop-color="#070D1E" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B48E25" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Blueprint CAD Grid lines -->
  <g stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,6">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Truck CAD Outline: Cargo Box & Cab -->
  <g id="truck-graphics" transform="translate(68, 140)">
    <!-- Dimension arrows (CAD style) -->
    <line x1="10" y1="20" x2="245" y2="20" stroke="#FCD34D" stroke-width="2" stroke-dasharray="2,2" />
    <polygon points="6,20 16,16 16,24" fill="#FCD34D" />
    <polygon points="249,20 239,16 239,24" fill="#FCD34D" />

    <!-- Cargo Body Box -->
    <rect x="10" y="34" width="240" height="130" rx="8" fill="#1C2541" fill-opacity="0.85" stroke="url(#gold)" stroke-width="4" />
    <!-- Subframe rails -->
    <rect x="25" y="164" width="220" height="14" rx="2" fill="#334155" stroke="#D4AF37" stroke-width="2" />
    <!-- Vertical stakes / slats on box -->
    <line x1="70" y1="34" x2="70" y2="164" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5" />
    <line x1="130" y1="34" x2="130" y2="164" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5" />
    <line x1="190" y1="34" x2="190" y2="164" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5" />

    <!-- Driver Cab -->
    <path d="M 256 75 L 315 75 L 345 120 L 358 120 L 358 178 L 256 178 Z" fill="#111827" stroke="url(#gold)" stroke-width="4" />
    <!-- Windshield -->
    <polygon points="266,85 308,85 334,122 266,122" fill="#38BDF8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2" />

    <!-- Wheels -->
    <!-- Rear Wheels (Dual/Single under body) -->
    <g transform="translate(85, 178)">
      <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="url(#gold)" stroke-width="4" />
      <circle cx="0" cy="0" r="14" fill="#334155" stroke="#FCD34D" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#D4AF37" />
    </g>
    <!-- Front Wheel (under cab) -->
    <g transform="translate(310, 178)">
      <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="url(#gold)" stroke-width="4" />
      <circle cx="0" cy="0" r="14" fill="#334155" stroke="#FCD34D" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#D4AF37" />
    </g>
  </g>

  <!-- Typography Brand -->
  <g transform="translate(256, 400)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#goldLight)" letter-spacing="4" filter="url(#glow)">NOWA FIRMA</text>
    <text y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#94A3B8" letter-spacing="6">KREATOR ZABUDÓW</text>
  </g>
</svg>
